name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # Cover the Docker runtime and the live Streamlit Cloud interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The suite includes the published-example validations (IAEA SRS 47 Co-60
      # barrier, NRC RG 8.39 Example 2) and the Streamlit AppTest regressions.
      - name: Run tests
        run: python -m coverage run --source=shieldlab,ui -m pytest -q

      - name: Coverage summary
        run: |
          python -m coverage report --sort=cover >> "$GITHUB_STEP_SUMMARY"
