# ShieldLab Streamlit runtime config (used both locally and in the container).
[server]
headless = true
address = "0.0.0.0"
port = 8501
# XSRF protection stays ON; Streamlit therefore enforces compatible CORS.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0B6673"
backgroundColor = "#F4F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102A36"
font = "sans-serif"
